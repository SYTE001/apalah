<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVAA — Admin Panel</title>
  <meta name="description" content="Novaa luxury fashion brand admin dashboard — manage folders and products">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>NOVAA</h1>
      <p>Admin Dashboard</p>
    </div>
    <div class="sidebar-section">Manajemen</div>
    <div class="folder-nav" style="padding-bottom:0">
      <div class="fnav-item" id="navManageFolders">
        <span class="fnav-emoji">⚙️</span>
        <span class="fnav-name">Kelola Folder</span>
      </div>
    </div>
    <div class="sidebar-section">Folder Produk</div>
    <nav class="folder-nav" id="folderNav"></nav>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrap">
    <!-- TOPBAR -->
    <header class="topbar" id="topbar">
      <div class="topbar-field">
        <label>API URL</label>
        <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/...">
      </div>
      <div class="topbar-field" style="max-width:200px">
        <label>Token</label>
        <input type="password" id="apiToken" placeholder="••••••••">
      </div>
      <button class="btn-refresh" id="btnRefresh">
        <span class="icon">↻</span> Refresh
      </button>
    </header>

    <!-- CONTENT -->
    <main class="content" id="mainContent">
      <div class="empty-state anim-fade-up">
        <div class="icon">✦</div>
        <p>Masukkan API URL di atas<br>lalu pilih folder untuk memulai.</p>
      </div>
    </main>
  </div>

  <!-- TOAST -->
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- CONFIRM MODAL -->
  <div class="modal-bg" id="confirmModal">
    <div class="modal">
      <div class="modal-title" id="confirmTitle">Hapus?</div>
      <div class="modal-msg" id="confirmMsg">Item ini akan dihapus permanen.</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmNo">Batal</button>
        <button class="btn btn-danger" id="confirmYes">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <!-- LOADING -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
